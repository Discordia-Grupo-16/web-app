# web-app/.github/workflows/ci.yml
# The pipeline itself lives in discordia-ci.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Discordia-Grupo-16/discordia-ci/.github/workflows/node-app.yml@v1
    with:
      node-version: "22"
      # npm workspaces: both client apps under apps/ and the three packages.
      # Every one has a `build` script, which in the packages and in mobile-app
      # is the typecheck (tsc --noEmit).
      workspaces: '["web-app", "mobile-app", "@discordia/api", "@discordia/core", "@discordia/ui"]'
      # Tests: Vitest in web-app, @discordia/api and @discordia/core, Jest in
      # mobile-app. @discordia/ui has no tests yet; --if-present skips it.
      run-tests: true