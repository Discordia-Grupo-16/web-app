# web-app/.github/workflows/ci.yml
# The pipeline itself lives in discordia-ci.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Discordia-Grupo-16/discordia-ci/.github/workflows/node-app.yml@v1
    with:
      node-version: "22"
      # npm workspace: both client apps live in this repo under apps/.
      workspaces: '["web-app", "mobile-app"]'
      # Turn on once either workspace has a test runner and a `test` script.
      run-tests: false